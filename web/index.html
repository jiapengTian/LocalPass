function promptGestureForSetup() {
  openSheet(`
    <div class="grabber"></div>
    <div class="row"><div class="grow" style="text-align:center;font-weight:600">画一个解锁手势</div></div>
    <div id="gsWrap" style="position:relative;width:280px;height:280px;margin:18px auto;touch-action:none;background:rgba(255,255,255,.045);border:1px solid var(--stroke);border-radius:18px">
      <svg id="gsSvg" style="position:absolute;inset:0;pointer-events:none"></svg>
    </div>
    <div class="tiny muted" id="gsTip" style="text-align:center;min-height:20px">连接至少 4 个点</div>`);
  const wrap = $('#gsWrap'), svg = $('#gsSvg');
  const dots = [];
  for (let i = 0; i < 9; i++) {
    const x = (i % 3) * 100 + 40, y = Math.floor(i / 3) * 100 + 40;
    dots.push([x, y]);
    const el = document.createElement('div');
    el.className = 'dot'; el.style.cssText = `left:${x}px;top:${y}px;position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);transition:.12s`;
    wrap.appendChild(el);
  }
  let active = [], drawing = false, first = null;
  const local = p => { const r = wrap.getBoundingClientRect(); return [p.clientX - r.left, p.clientY - r.top]; };
  const hit = ([x, y]) => dots.findIndex(([dx, dy]) => Math.hypot(dx - x, dy - y) < 40);
  const redraw = () => {
    svg.innerHTML = active.length > 1
      ? `<polyline points="${active.map(i => dots[i].join(',')).join(' ')}" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>` : '';
    wrap.querySelectorAll('.dot').forEach((el, i) => el.style.background = active.includes(i) ? '#fff' : 'rgba(255,255,255,.16)');
  };
  wrap.onpointerdown = e => { e.preventDefault(); active = []; drawing = true; wrap.setPointerCapture(e.pointerId); const i = hit(local(e)); if (i >= 0) active.push(i); redraw(); };
  wrap.onpointermove = e => { if (!drawing) return; const i = hit(local(e)); if (i >= 0 && !active.includes(i)) { active.push(i); redraw(); } };
  wrap.onpointerup = () => {
    drawing = false;
    const seq = [...active]; active = []; redraw();
    if (seq.length < 4) return $('#gsTip').textContent = '至少要连接 4 个点';
    if (!first) { first = seq; $('#gsTip').textContent = '再画一次确认'; return; }
    if (first.join('-') !== seq.join('-')) { first = null; return $('#gsTip').textContent = '两次手势不一致，请重新绘制'; }
    setupGesture = seq; closeSheet();
    $('#swGesture').classList.add('on');
    toast('手势已记录，创建密码库后生效');
  };
}

/* =========================================================================
   图片视频库
   - 缩略图：随密码库一起加密（体积小，打开即可秒显）
   - 原文件：用同一把库密钥 AES-GCM 加密后存进 IndexedDB（不在 localStorage 里）
   - 查看时才解密到内存，用完立刻 revoke
   ========================================================================= */
const MEDIA_DB = 'localpass.media.v1';
const MEDIA_STORE = 'blobs';
const MEDIA_MAX_BYTES = 300 * 1024 * 1024;   // 单个文件上限 300MB
let mediaDBPromise = null;

function mediaDB() {
  if (mediaDBPromise) return mediaDBPromise;
  mediaDBPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(MEDIA_DB, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(MEDIA_STORE)) db.createObjectStore(MEDIA_STORE);
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return mediaDBPromise;
}

async function dbPut(id, buffer) {
  const db = await mediaDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(MEDIA_STORE, 'readwrite');
    tx.objectStore(MEDIA_STORE).put(buffer, id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function dbGet(id) {
  const db = await mediaDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(MEDIA_STORE, 'readonly');
    const req = tx.objectStore(MEDIA_STORE).get(id);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}
async function dbDel(id) {
  const db = await mediaDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(MEDIA_STORE, 'readwrite');
    tx.objectStore(MEDIA_STORE).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function dbKeys() {
  const db = await mediaDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(MEDIA_STORE, 'readonly');
    const req = tx.objectStore(MEDIA_STORE).getAllKeys();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}
async function dbClear() {
  try {
    const db = await mediaDB();
    await new Promise((resolve) => {
      const tx = db.transaction(MEDIA_STORE, 'readwrite');
      tx.objectStore(MEDIA_STORE).clear();
      tx.oncomplete = resolve;
      tx.onerror = resolve;
    });
  } catch {}
}

/* ---------------- 工具 ---------------- */
function fmtBytes(n) {
  if (!n && n !== 0) return '';
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(0) + ' KB';
  if (n < 1024 * 1024 * 1024) return (n / 1024 / 1024).toFixed(1) + ' MB';
  return (n / 1024 / 1024 / 1024).toFixed(2) + ' GB';
}
function fmtDuration(sec) {
  if (!sec || !isFinite(sec)) return '';
  const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
  return m + ':' + String(s).padStart(2, '0');
}
function blobToDataURL(blob) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => resolve(fr.result);
    fr.onerror = () => reject(fr.error);
    fr.readAsDataURL(blob);
  });
}
function loadImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('image decode failed')); };
    img.src = url;
  });
}
function drawToCanvas(source, w, h) {
  const ratio = Math.min(1, Math.max(w, h) / 2048);
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w * ratio));
  c.height = Math.max(1, Math.round(h * ratio));
  const ctx = c.getContext('2d');
  ctx.drawImage(source, 0, 0, c.width, c.height);
  return c;
}
function canvasToBlob(canvas, quality = 0.82) {
  return new Promise((resolve) => canvas.toBlob(b => resolve(b), 'image/jpeg', quality));
}

async function makeImageThumb(file) {
  const img = await loadImage(file);
  const scale = Math.min(1, 1600 / Math.max(img.width, img.height));
  const full = drawToCanvas(img, img.width * scale, img.height * scale);
  const tScale = Math.min(1, 320 / Math.max(img.width, img.height));
  const thumb = drawToCanvas(img, img.width * tScale, img.height * tScale);
  return {
    width: Math.round(img.width * scale),
    height: Math.round(img.height * scale),
    thumbBlob: await canvasToBlob(thumb, 0.72),
    fullBlob: await canvasToBlob(full, 0.85),
  };
}

function loadVideoFrame(file) {
  return new Promise((resolve) => {
    const url = URL.createObjectURL(file);
    const v = document.createElement('video');
    v.muted = true; v.playsInline = true; v.preload = 'metadata';
    let done = false;
    const finish = (result) => {
      if (done) return;
      done = true;
      URL.revokeObjectURL(url);
      resolve(result);
    };
    v.onloadeddata = () => {
      try { v.currentTime = Math.min(0.6, (v.duration || 1) / 3); } catch {}
    };
    v.onseeked = () => {
      try {
        const c = drawToCanvas(v, v.videoWidth, v.videoHeight);
        c.toBlob(b => finish({
          duration: v.duration,
          width: v.videoWidth,
          height: v.videoHeight,
          thumbBlob: b,
        }), 'image/jpeg', 0.72);
      } catch { finish(null); }
    };
    v.onerror = () => finish(null);
    setTimeout(() => finish(null), 9000);
    v.src = url;
  });
}

/* ---------------- 导入 ---------------- */
function showImport(label, pct) {
  const box = $('#importBox');
  box.classList.add('show');
  $('#importLabel').textContent = label;
  $('#importBar').style.width = Math.max(0, Math.min(100, pct)) + '%';
  $('#importPct').textContent = Math.round(pct) + '%';
}
function hideImport() {
  $('#importBox').classList.remove('show');
  $('#importBar').style.width = '0%';
}

async function importMediaFiles(fileList) {
  const files = [...fileList].filter(f => /^(image|video)\//.test(f.type));
  if (!files.length) { toast('只支持图片或视频文件'); return; }
  const box = $('#importBox');
  box.classList.add('show');

  let ok = 0;
  for (let i = 0; i < files.length; i++) {
    const file = files[i];
    const basePct = (i / files.length) * 100;
    const spanPct = 100 / files.length;
    showImport(`加密 ${file.name}`, basePct);

    if (file.size > MEDIA_MAX_BYTES) {
      toast(`${file.name} 超过 300MB，已跳过`);
      continue;
    }

    try {
      const kind = file.type.startsWith('video/') ? 'video' : 'image';
      let prepared;
      let thumbBlob = null;
      let meta = { width: 0, height: 0, duration: 0 };

      if (kind === 'image') {
        prepared = await makeImageThumb(file);
        thumbBlob = prepared.thumbBlob;
        meta = { width: prepared.width, height: prepared.height, duration: 0 };
      } else {
        const frame = await loadVideoFrame(file);
        if (frame) {
          thumbBlob = frame.thumbBlob;
          meta = { width: frame.width, height: frame.height, duration: frame.duration };
        }
      }

      // 原文件 / 压缩后的照片
      const payload = kind === 'image' ? prepared.fullBlob : file;
      showImport(`加密 ${file.name}`, basePct + spanPct * 0.35);
      const plain = await payload.arrayBuffer();
      const box2 = await aesEncrypt(State.vaultKey, new Uint8Array(plain));

      const id = 'm-' + uid().slice(0, 8);
      const buffer = enc.encode(JSON.stringify({ v: 1, ...box2 }));

      showImport(`写入 ${file.name}`, basePct + spanPct * 0.7);
      await dbPut(id, buffer.buffer);

      let thumbDataURL = '';
      if (thumbBlob) thumbDataURL = await blobToDataURL(thumbBlob);

      const item = {
        id, kind,
        name: file.name,
        mime: payload.type || file.type,
        size: payload.size || file.size,
        width: meta.width, height: meta.height, duration: meta.duration,
        thumb: thumbDataURL,
        createdAt: new Date().toISOString(),
      };
      if (!Array.isArray(State.store.media)) State.store.media = [];
      State.store.media.push(item);
      await writeFile();
      ok += 1;
      showImport(`完成 ${file.name}`, basePct + spanPct);
    } catch (err) {
      console.error(err);
      toast(`导入失败：${file.name}`);
    }
  }

  hideImport();
  renderMedia();
  if (ok) toast(`已加密保存 ${ok} 个文件，只在本机`);
}

function pickMedia() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*,video/*';
  input.multiple = true;
  input.onchange = () => { if (input.files && input.files.length) importMediaFiles(input.files); };
  input.click();
}

/* ---------------- 渲染 ---------------- */
function mediaItems() {
  const all = Array.isArray(State.store.media) ? State.store.media : [];
  const list = State.mediaFilter === 'image' ? all.filter(m => m.kind === 'image')
    : State.mediaFilter === 'video' ? all.filter(m => m.kind === 'video')
    : all;
  return [...list].sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
}

function renderMedia() {
  const grid = $('#mediaGrid');
  const items = mediaItems();
  const total = (State.store.media || []).length;
  if (!items.length) {
    grid.innerHTML = `<div class="media-empty">
      <div class="big">${icon('media', 34)}</div>
      <div>${total ? '这个筛选下没有内容' : '还没有照片或视频'}</div>
      <div class="tiny" style="margin-top:6px;color:var(--text-3)">
        ${total ? '切换到「全部」看看' : '导入后会被加密保存在本机，<br>不会上传到任何服务器'}
      </div>
      ${total ? '' : `<button class="btn btn-primary" id="mediaEmptyAdd" style="margin:18px auto 0;max-width:180px;height:46px">选择文件</button>`}
    </div>`;
    const b = $('#mediaEmptyAdd');
    if (b) b.onclick = pickMedia;
    return;
  }
  grid.innerHTML = items.map((m, idx) => {
    const isVideo = m.kind === 'video';
    return `<div class="mcell" data-mid="${m.id}">
      ${m.thumb ? `<img src="${m.thumb}" alt="">` : `<div class="ph">${icon(isVideo ? 'video' : 'image', 26)}</div>`}
      ${isVideo ? `<div class="playico">${icon('play', 34)}</div>` : ''}
      <div class="badge">${isVideo ? icon('video', 11) + fmtDuration(m.duration) : icon('image', 11) + fmtBytes(m.size).replace(' ', '')}</div>
    </div>`;
  }).join('');
  grid.onclick = e => {
    const cell = e.target.closest('[data-mid]');
    if (!cell) return;
    const idx = items.findIndex(m => m.id === cell.dataset.mid);
    openViewer(idx);
  };
}

/* ---------------- 查看器 ---------------- */
async function openViewer(idx) {
  const items = mediaItems();
  if (idx < 0 || idx >= items.length) return;
  State.viewerIndex = idx;
  const item = items[idx];
  const viewer = $('#viewer');
  const body = $('#vBody');
  viewer.classList.add('show');
  document.body.style.overflow = 'hidden';
  $('#vName').textContent = item.name;
  $('#vCount').textContent = `${idx + 1} / ${items.length}`;
  body.innerHTML = `<div class="vempty">正在解密…</div>`;

  releaseViewerURL();
  try {
    const raw = await dbGet(item.id);
    if (!raw) throw new Error('missing');
    const box2 = JSON.parse(dec.decode(new Uint8Array(raw)));
    const plain = await aesDecrypt(State.vaultKey, box2);
    const blob = new Blob([plain], { type: item.mime || 'application/octet-stream' });
    const url = URL.createObjectURL(blob);
    State.viewerURL = url;
    if (item.kind === 'video') {
      body.innerHTML = `<video src="${url}" controls playsinline autoplay></video>`;
    } else {
      body.innerHTML = `<img src="${url}" alt="">`;
    }
  } catch (err) {
    console.error(err);
    body.innerHTML = `<div class="vempty">无法解密这个文件<br><span style="font-size:12px;opacity:.7">可能已被移动或删除</span></div>`;
  }
}

function releaseViewerURL() {
  if (State.viewerURL) {
    URL.revokeObjectURL(State.viewerURL);
    State.viewerURL = null;
  }
}

function closeViewer() {
  $('#viewer').classList.remove('show');
  $('#vBody').innerHTML = '';
  releaseViewerURL();
  State.viewerIndex = -1;
  document.body.style.overflow = '';
}

function stepViewer(delta) {
  const items = mediaItems();
  if (!items.length) return;
  const next = (State.viewerIndex + delta + items.length) % items.length;
  openViewer(next);
}

async function downloadCurrent() {
  const items = mediaItems();
  const item = items[State.viewerIndex];
  if (!item || !State.viewerURL) return;
  const a = document.createElement('a');
  a.href = State.viewerURL;
  a.download = item.name || ('media-' + item.id);
  a.click();
  toast('已导出到你选择的位置');
}

async function deleteCurrent() {
  const items = mediaItems();
  const item = items[State.viewerIndex];
  if (!item) return;
  if (!confirm(`删除「${item.name}」？删除后无法恢复。`)) return;
  try {
    await dbDel(item.id);
  } catch {}
  State.store.media = (State.store.media || []).filter(m => m.id !== item.id);
  await writeFile();
  closeViewer();
  renderMedia();
  toast('已删除');
}

/* ---------------- 视图切换 ---------------- */
function switchVault(vault) {
  if (State.vault === vault) return;
  State.vault = vault;
  const media = vault === 'media';
  $$('.vtab').forEach(b => b.classList.toggle('on', b.dataset.vault === vault));
  $('#tabGlider').classList.toggle('right', media);
  $('#passwordPane').classList.toggle('active', !media);
  $('#mediaPane').classList.toggle('active', media);
  $('#vaultTitle').textContent = media ? '图片视频库' : '密码库';
  $('#vaultMark').innerHTML = media
    ? '<svg><use href="#i-media"/></svg>'
    : '<svg><use href="#i-shield"/></svg>';
  $('#btnAdd').classList.toggle('hidden', media);
  $('#fab').classList.toggle('hidden', media || State.view !== 'home');
  updateHeaderStats();
  if (media) {
    const total = (State.store.media || []).length;
    const vids = (State.store.media || []).filter(m => m.kind === 'video').length;
    $('#stats').textContent = total
      ? `共 ${total} 个文件 · ${total - vids} 张照片 · ${vids} 个视频`
      : '照片和视频会被加密保存在本机';
    renderMedia();
  } else {
    renderList();
  }
}

/* ---------------- 绑定 ---------------- */
$$('.vtab').forEach(b => { b.onclick = () => switchVault(b.dataset.vault); });
$('#btnMediaAdd').onclick = pickMedia;
$('#mediaFilter').onclick = e => {
  const b = e.target.closest('[data-mfilter]');
  if (!b) return;
  State.mediaFilter = b.dataset.mfilter;
  $$('#mediaFilter button').forEach(x => x.classList.toggle('on', x === b));
  renderMedia();
};
$('#vClose').onclick = closeViewer;
$('#vPrev').onclick = () => stepViewer(-1);
$('#vNext').onclick = () => stepViewer(1);
$('#vDownload').onclick = downloadCurrent;
$('#vDelete').onclick = deleteCurrent;
document.addEventListener('keydown', e => {
  if (!$('#viewer').classList.contains('show')) return;
  if (e.key === 'Escape') closeViewer();
  if (e.key === 'ArrowLeft') stepViewer(-1);
  if (e.key === 'ArrowRight') stepViewer(1);
});

/* =========================================================================
   启动
   ========================================================================= */
window.addEventListener('unhandledrejection', e => {
  console.error(e.reason);
  const msg = String(e.reason && (e.reason.message || e.reason));
  if (/NotAllowedError|SecurityError/i.test(msg)) {
    toast('系统验证被拒绝或不可用');
  } else {
    toast('出错了：' + msg.slice(0, 60));
  }
});

async function boot() {
  loadSettings();
  try {
    State.file = readFile();
    if (!State.file) { startSetup(); return; }
    State.phase = 'locked';
    setupLockScreen();
    show('lockScreen');
  } catch (err) {
    console.error(err);
    $('#lockErr').textContent = '启动失败：' + err.message;
    show('lockScreen');
  }
}
boot();
</script>
